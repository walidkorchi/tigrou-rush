# World where the rush game takes place
gameWorld: world_the_end

# World where players spawn when game stops
lobbyWorld: world

# Database configuration (PostgreSQL)
database:
  host: localhost
  port: 5432
  name: rush
  username: rush
  password: rush

# Radius around beds where block placement is prevented
bedProtectionRadius: 3

# minecraft defaults it to 4s
explodeTicks: 80

# Radius affected by the explosion. Minecraft default is 4.0
radius: 4.0

# Reduce the fall damage by dividing the damages (useful for TNT Fly). Set to 1.0 to not reduce it
fallDamage: 5.0

# Reduce the TNT damage by dividing the damages (useful for TNT Fly). Set to 1.0 to not reduce it
TNTDamage: 5.0

# Schematic filename for the rush island
schematicFilename: rush_island.schem

# Distance from center point to islands
islandOffset: 40

# Respawn protection time in seconds (0 to disable)
respawn-protection: 0

# Villager spawn offsets (distance from island center)
villagerSpeedOffset: 13
villagerRegularOffset: 12
villagerSpreadDistance: 5,7

# Resources config
resource:
  copper:
    item:
      - type: COPPER_INGOT
        amount: 1
    spawn-interval: 1000
    spread: 1.0
  iron:
    item:
      - type: IRON_INGOT
        amount: 1
    spawn-interval: 10000
    spread: 1.0
  gold:
    item:
      - type: GOLD_INGOT
        amount: 1
    spawn-interval: 20000
    spread: 1.0
  diamond:
    item:
      - type: DIAMOND
        amount: 1
    spawn-interval: 300000
    spread: 1.0
