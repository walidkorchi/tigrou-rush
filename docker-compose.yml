version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rush
      POSTGRES_USER: rush
      POSTGRES_PASSWORD: rush
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rush -d rush"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
