# --- Plugin Configuration ---

database:
  host: localhost
  port: 5432
  name: rush
  username: rush
  password: rush


# --- Ranks Configuration ---

rank:
  first-rank-xp: 10000
  rank-multiplier: 1.25
  prestige-nerfs:
    - 1.0                                     # Bronze prestige
    - 0.8                                     # Silver prestige
    - 0.5                                     # Gold prestige


# --- TNT Configuration ---

TNTDamage: 5.0                                # Reduce the TNT damage by dividing the damages (useful for TNT Fly)
radius: 4.0                                   # Radius affected by the explosion. Minecraft defaults is to 4.0
explodeTicks: 80                              # Minecraft defaults it to 4s
fallDamage: 5.0                               # Reduce the fall damage by dividing the damages (useful for TNT Fly)


# --- Islands/Map Configuration ---

schematicFilename: rush_island.schem          # Schematic filename for the rush island
islandOffset: 30                              # Distance from center point to islands
void-threshold: 20                            # Blocks below islandY at which a falling player is rescued and teleported back to their bed
villagerSpeedOffset: 13                       # Villager spawn offsets (distance from island center)
villagerRegularOffset: 12
villagerSpreadDistance: 5,7


# --- Kill Tracker Configuration ---

kill-tracker:
  assist-threshold: 0.25                      # Fraction of killer's damage another player must deal to count as an assist
  last-hit-expiry-ms: 10000                   # Milliseconds after the last hit within which an indirect kill is still credited


# --- Game Configuration ---

max-replays: 20                               # Max replay files retained (oldest deleted on save)
distance-height-limit: 12                     # Max island paste height: worldMaxHeight - this value
overtime-duration: 30                         # Minutes of play before overtime begins (beds destroyed, all restrictions lifted)
bedProtectionRadius: 3                        # Radius around beds where block placement is prevented
respawn-protection: 4                         # Respawn protection time in seconds (0 to disable)
merchantProtectionRadius: 1                   # Radius around regular merchants where block placement is prevented
lobbyWorld: world                             # World where players spawn when game stops


# --- Resources Configuration ---

resource:
  copper:
    item:
      - type: COPPER_INGOT
        amount: 1
    spawn-interval: 1000
    spread: 1.0
  iron:
    item:
      - type: IRON_INGOT
        amount: 1
    spawn-interval: 10000
    spread: 1.0
  gold:
    item:
      - type: GOLD_INGOT
        amount: 1
    spawn-interval: 20000
    spread: 1.0
  diamond:
    item:
      - type: DIAMOND
        amount: 1
    spawn-interval: 300000
    spread: 1.0

# --- Merchants Configuration ---
# Each merchant type has a list of trades. Cost is a list (first = primary, second = optional second cost).
# Enchantments are keyed by enchantment name (lowercase).
# Potion trades use `potion:` key instead of `result:`.

merchants:
  weaponsmith:
    trades:
      - result: IRON_SWORD
        cost:
          - material: IRON_INGOT
            amount: 1
        enchantments:
          sharpness: 1
      - result: IRON_SWORD
        cost:
          - material: IRON_INGOT
            amount: 3
        enchantments:
          sharpness: 2
      - result: IRON_SWORD
        cost:
          - material: IRON_INGOT
            amount: 7
        enchantments:
          sharpness: 3
      - result: DIAMOND_SWORD
        cost:
          - material: IRON_INGOT
            amount: 5
          - material: DIAMOND
            amount: 1
        enchantments:
          sharpness: 2
        durability: 85
      - result: FLINT_AND_STEEL
        cost:
          - material: GOLD_INGOT
            amount: 1
      - result: TNT
        cost:
          - material: IRON_INGOT
            amount: 5
  builder:
    trades:
      - result: SANDSTONE
        resultAmount: 4
        cost:
          - material: COPPER_INGOT
            amount: 1
      - result: END_STONE
        resultAmount: 4
        cost:
          - material: IRON_INGOT
            amount: 2
      - result: IRON_PICKAXE
        cost:
          - material: IRON_INGOT
            amount: 1
        enchantments:
          efficiency: 1
      - result: IRON_PICKAXE
        cost:
          - material: COPPER_INGOT
            amount: 5
        enchantments:
          efficiency: 2
      - result: IRON_PICKAXE
        cost:
          - material: GOLD_INGOT
            amount: 1
        enchantments:
          efficiency: 3
  alchemist:
    trades:
      - result: GOLDEN_APPLE
        cost:
          - material: IRON_INGOT
            amount: 1
      - potion: HEALING
        upgrade: true
        cost:
          - material: GOLD_INGOT
            amount: 1
  armorsmith:
    trades:
      - result: LEATHER_CHESTPLATE
        cost:
          - material: IRON_INGOT
            amount: 2
      - result: LEATHER_CHESTPLATE
        cost:
          - material: IRON_INGOT
            amount: 5
        enchantments:
          protection: 1
      - result: LEATHER_CHESTPLATE
        cost:
          - material: GOLD_INGOT
            amount: 1
        enchantments:
          protection: 2
      - result: LEATHER_CHESTPLATE
        cost:
          - material: GOLD_INGOT
            amount: 5
        enchantments:
          protection: 3
      - result: COMPASS
        cost:
          - material: DIAMOND
            amount: 16
  speed:
    trades: []
